<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BEYOND IMAGINATION</title>
    
    <style>
        :root { --beyond-purple: #3e38a2; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #fdfdfd; color: var(--beyond-purple); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* תפריט ניווט תחתון אחיד */
        .nav-list { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius: 30px; display: flex; justify-content: space-around; padding: 10px; z-index: 1000; box-shadow: 0 5px 20px rgba(0,0,0,0.1); border: 1px solid rgba(62, 56, 162, 0.1); }
        .nav-link.main-nav { display: flex; flex-direction: column; align-items: center; color: var(--beyond-purple); opacity: 0.5; cursor: pointer; }
        .nav-link.main-nav.active { opacity: 1; }
        .nav-icon { width: 24px; height: 24px; fill: var(--beyond-purple); }
        .nav-text { font-size: 11px; font-weight: bold; margin-top: 4px; }

        /* קרוסלת פרויקטים */
        #main-viewport { padding: 40px 10px 120px 10px; width: 100%; max-width: 800px; margin: 0 auto; }
        .projects-gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 20px; padding-bottom: 20px; }
        .project-card { min-width: 90vw; scroll-snap-align: center; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }

        /* חצים מוגדלים ונגישים */
        .arrow-button { position: absolute; top: 40%; width: 50px; height: 50px; background: var(--beyond-purple); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 500; cursor: pointer; }
        .prev-arrow { left: 5px; } .next-arrow { right: 5px; }

        /* פוסטרים ועיצוב */
        .poster-container { position: relative; width: 100%; aspect-ratio: 9/16; border-radius: 15px; overflow: hidden; background: #000; }
        .poster-image { width: 100%; height: 100%; object-fit: cover; }
        .play-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.2); }
        .play-button { width: 60px; height: 60px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .play-button svg { width: 30px; fill: var(--beyond-purple); }
        
        .brand-logo-home { height: 200px; margin: 0 auto 20px; display: block; }
        .page-content { display: none; } .page-content.active { display: block; }
        .workflow-step { font-size: 14px; margin-bottom: 8px; }
    </style>
</head>
<body>

    <nav class="nav-list">
        <div class="nav-link main-nav active" onclick="switchPage('home', this)">
            <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></div>
            <span class="nav-text">ראשי</span>
        </div>
        <div class="nav-link main-nav" onclick="switchPage('portfolio', this)">
            <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg></div>
            <span class="nav-text">פורטפוליו</span>
        </div>
        <div class="nav-link main-nav" onclick="switchPage('about', this)">
            <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
            <span class="nav-text">אודות</span>
        </div>
        <div class="nav-link main-nav" onclick="switchPage('contact', this)">
            <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg></div>
            <span class="nav-text">קשר</span>
        </div>
    </nav>

    <main id="main-viewport">
        <div id="home" class="page-content active">
            <img src="logo.jpg" class="brand-logo-home">
            <div class="project-card">טריילר המותג יופיע כאן בקרוב</div>
        </div>

        <div id="portfolio" class="page-content">
            <div class="projects-container">
                <div class="arrow-button prev-arrow" onclick="scrollGallery(-1)">&#10094;</div>
                <div class="arrow-button next-arrow" onclick="scrollGallery(1)">&#10095;</div>
                <div class="projects-gallery" id="projects-gallery">
                    <div class="project-card">
                        <h3>🎬 הנבחר</h3>
                        <a href="https://drive.google.com/file/d/1bZKr2wG7QsJDWBU0K1PJKnE1V3RbFPvV/view" target="_blank" class="poster-link">
                            <div class="poster-container"><img src="1000178137.jpg" class="poster-image"><div class="play-overlay"><div class="play-button"><svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg></div></div></div>
                        </a>
                        <div class="workflow-step">✨ <strong>Branding:</strong> שדרוג וזיקוק לוגו 3D ב-Magnific AI.</div>
                        <div class="workflow-step">🚀 <strong>Scene Gen:</strong> Nano Banana + Photoshop.</div>
                        <div class="workflow-step">🎞️ <strong>Animation:</strong> Kling AI.</div>
                        <div class="workflow-step">🎙️ <strong>Audio:</strong> ElevenLabs, Suno, Pixabay SFX.</div>
                        <div class="workflow-step">💻 <strong>Post:</strong> Premiere Pro, Auto Ducking.</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function switchPage(id, el) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.main-nav').forEach(l => l.classList.remove('active'));
            el.classList.add('active');
        }
        function scrollGallery(dir) {
            const gallery = document.getElementById('projects-gallery');
            gallery.scrollBy({ left: gallery.offsetWidth * dir, behavior: 'smooth' });
        }
    </script>
</body>
</html>
