<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEYOND IMAGINATION | Professional Portfolio</title>
    
    <style>
        @font-face { font-family: 'Righteous'; src: url('Righteous-Regular.ttf') format('truetype'); }
        :root { --bg-white: #ffffff; --beyond-purple: #3e38a2; --sidebar-bg: #f8f9ff; --font-clean: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-white); color: var(--beyond-purple); min-height: 100vh; display: flex; transition: 0.3s; flex-direction: row; }

        /* התאמה לנייד - שינוי כיוון התצוגה */
        @media (max-width: 900px) {
            body { flex-direction: column; overflow-y: auto; }
            #sidebar-hub { width: 100% !important; height: auto !important; border-right: none !important; border-bottom: 2px solid rgba(62, 56, 162, 0.05); position: static !important; }
            .brand-logo { height: 120px !important; }
            #main-viewport { padding: 30px 20px !important; overflow-y: visible !important; }
            .hero-section h1 { font-size: 35px !important; }
            .nav-list { flex-direction: row !important; flex-wrap: wrap; justify-content: center; }
            .nav-link { padding: 10px !important; font-size: 14px !important; }
        }

        body.lang-he * { font-family: var(--font-clean) !important; }
        body.lang-en * { font-family: 'Righteous', sans-serif !important; letter-spacing: 1px; }
        body.lang-en .bio-text, body.lang-en .contact-form input, body.lang-en .contact-form textarea, body.lang-en .social-link, body.lang-en .workflow-title, body.lang-en .workflow-step { font-family: var(--font-clean) !important; letter-spacing: normal; }
        
        #sidebar-hub { width: 340px; background: var(--sidebar-bg); border-left: 2px solid rgba(62, 56, 162, 0.05); border-right: 2px solid rgba(62, 56, 162, 0.05); display: flex; flex-direction: column; padding: 30px 20px; transition: 0.3s; flex-shrink: 0; }
        .branding-area { text-align: center; margin-bottom: 40px; }
        .brand-logo { width: auto; height: 220px; display: block; margin: 0 auto; }
        
        .nav-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .nav-link { padding: 14px 18px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 18px; opacity: 0.6; color: var(--beyond-purple); transition: 0.3s; font-weight: bold; }
        .nav-link:hover, .nav-link.active { opacity: 1; background: rgba(62, 56, 162, 0.05); }
        .nav-link.active { background: var(--beyond-purple); color: #fff; }
        
        #main-viewport { flex-grow: 1; padding: 50px 70px; overflow-y: auto; background: #fdfdfd; }
        .hero-section h1 { font-size: 55px; font-weight: 900; }
        .hero-line { width: 90px; height: 6px; background: var(--beyond-purple); border-radius: 3px; margin: 12px 0 40px 0; }
        .page-content { display: none; max-width: 950px; }
        .page-content.active { display: block; animation: fadeIn 0.6s ease-out; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .project-card { background: white; padding: 35px; border-radius: 25px; box-shadow: 0 5px 25px rgba(0,0,0,0.03); margin-bottom: 50px; border: 1px solid #f1f1f1; }
        .video-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; border-radius: 15px; overflow: hidden; margin: 25px 0; background: #000; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .bio-text { font-size: 19px; line-height: 1.7; color: #333; margin-bottom: 20px; }
        .workflow-title { font-size: 22px; font-weight: bold; margin: 25px 0 15px 0; color: var(--beyond-purple); border-bottom: 1px solid rgba(62, 56, 162, 0.1); padding-bottom: 8px; }
        .workflow-step { margin-bottom: 12px; font-size: 17px; line-height: 1.6; }
        
        /* אזור תגובות */
        #disqus_thread { margin-top: 50px; padding: 20px; background: #f9f9f9; border-radius: 15px; }

        .contact-form { display: flex; flex-direction: column; }
        .contact-form input, .contact-form textarea { width: 100%; padding: 18px; margin-bottom: 20px; border: 1px solid #e0e0e0; border-radius: 12px; font-size: 18px; }
        .contact-form button { padding: 18px 50px; background: var(--beyond-purple); color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 20px; font-weight: bold; width: max-content; }
        
        .social-links { display: flex; gap: 15px; margin-top: 30px; flex-wrap: wrap; }
        .social-link { text-decoration: none; color: var(--beyond-purple); border: 2px solid var(--beyond-purple); padding: 10px 20px; border-radius: 50px; font-weight: bold; }
    </style>
</head>
<body class="lang-he">

    <aside id="sidebar-hub">
        <div class="branding-area">
            <img src="logo.jpg" alt="BEYOND IMAGINATION" class="brand-logo">
        </div>
        <nav class="nav-list">
            <div class="nav-link active" onclick="switchPage('portfolio', this)">🎬 <span data-he="פורטפוליו" data-en="PORTFOLIO">פורטפוליו</span></div>
            <div class="nav-link" onclick="switchPage('about', this)">👤 <span data-he="קצת עליי" data-en="ABOUT ME">קצת עליי</span></div>
            <div class="nav-link" onclick="switchPage('contact', this)">📧 <span data-he="צור קשר" data-en="CONTACT">צור קשר</span></div>
            <div class="nav-link" onclick="toggleLanguage()">🌍 <span id="lang-text">English</span></div>
        </nav>
    </aside>

    <main id="main-viewport">
        
        <div id="portfolio" class="page-content active">
            <header class="hero-section"><h1 data-he="הפרויקטים שלי" data-en="SELECTED WORKS">הפרויקטים שלי</h1><div class="hero-line"></div></header>
            
            <div class="project-card">
                <h2 style="color:var(--beyond-purple); margin-bottom:15px;">🎬 THE CHOSEN ONE</h2>
                <div class="video-container">
                    <iframe src="https://drive.google.com/file/d/1bZKr2wG7QsJDWBU0K1PJKnE1V3RbFPvV/preview"></iframe>
                </div>
                <div class="bio-text">
                    <p data-he="פרויקט סינמטי המשלב AI עם עריכת Premiere Pro מתקדמת..." data-en="A cinematic project blending AI with advanced Premiere Pro editing...">פרויקט סינמטי המשלב AI עם עריכת Premiere Pro מתקדמת...</p>
                </div>
            </div>

            <div class="project-card">
                <h2 style="color:var(--beyond-purple); margin-bottom:15px;">🎬 Welcome to the Future</h2>
                <div class="video-container">
                    <iframe src="https://drive.google.com/file/d/1b_xd7D01rYNROLQbGA7qzcinoiqfiXlT/preview"></iframe>
                </div>
                <div class="bio-text">
                    <p data-he="קונספט מדע בדיוני קולנועי..." data-en="Cinematic Sci-Fi Concept...">קונספט מדע בדיוני קולנועי...</p>
                </div>
            </div>

            <div id="disqus_thread"></div>
        </div>

        <div id="about" class="page-content">
             <header class="hero-section"><h1 data-he="קצת עליי" data-en="ABOUT ME">קצת עליי</h1><div class="hero-line"></div></header>
             <div class="bio-text">
                <p data-he="אני סתיו, אמן דיגיטלי ועורך וידאו..." data-en="I'm Stav, a digital artist and video editor...">אני סתיו, אמן דיגיטלי ועורך וידאו...</p>
             </div>
        </div>

        <div id="contact" class="page-content">
             <header class="hero-section"><h1 data-he="צור קשר" data-en="CONTACT">צור קשר</h1><div class="hero-line"></div></header>
             <form action="https://formsubmit.co/Stav22001@gmail.com" method="POST" class="contact-form">
                <input type="text" name="name" placeholder="שם מלא" required>
                <input type="email" name="email" placeholder="אימייל" required>
                <textarea name="message" placeholder="איך אוכל לעזור?" style="height:150px;" required></textarea>
                <button type="submit">שלח הודעה</button>
             </form>
        </div>

    </main>

    <script>
        let currentLang = 'he';
        function toggleLanguage() {
            currentLang = currentLang === 'he' ? 'en' : 'he';
            document.documentElement.dir = currentLang === 'he' ? 'rtl' : 'ltr';
            document.body.className = 'lang-' + currentLang;
            document.getElementById('lang-text').innerText = currentLang === 'he' ? 'English' : 'עברית';
            document.querySelectorAll('[data-he]').forEach(el => el.innerHTML = el.getAttribute('data-' + currentLang));
        }

        function switchPage(id, el) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            el.classList.add('active');
        }

        // הגדרת Disqus - תחליף את YOUR_DISQUS_SHORTNAME בשם שתקבל מהם
        var disqus_config = function () {
            this.page.url = window.location.href;  
            this.page.identifier = 'portfolio_main'; 
        };
        (function() { 
            var d = document, s = d.createElement('script');
            s.src = 'https://YOUR_DISQUS_SHORTNAME.disqus.com/embed.js';
            s.setAttribute('data-timestamp', +new Date());
            (d.head || d.body).appendChild(s);
        })();
    </script>
</body>
</html>
